<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>tree benchmarks generator (dev)</title></head>
<body>
<h1>生産性ツリー分位点の生成（開発用ハーネス）</h1>
<p>data/*.json（読むだけ）から導出ノードの分布分位点を計算し、data/tree_benchmarks.json に保存する。
既存の benchmarks.json・farm_metrics.json・metrics.json は変更しない。dev_server.py 起動中に開くこと。</p>
<pre id="log"></pre>
<script src="../assets/tree.js"></script>
<script type="module">
const log = m => document.getElementById('log').textContent += m + '\n';
const [farms, context, params, fm] = await Promise.all(
  ['farms', 'context', 'params', 'farm_metrics'].map(n => fetch('../data/' + n + '.json').then(r => r.json()))
);
const ctxById = {}; context.forEach(c => ctxById[c.farm_id] = c);
const val = {}; fm.forEach(r => { (val[r.farm_id] = val[r.farm_id] || {})[r.metric_id] = r.value; });
const fs = farms.map(f => ({
  id: f.farm_id, name: f.name, ku: f.ku,
  fatDays: val[f.farm_id].fatDays, mort: val[f.farm_id].mort,
  carcassWt: val[f.farm_id].carcassWt, price: val[f.farm_id].price,
  calfCostEff: ctxById[f.farm_id].calf_cost_eff_yen
}));
const dist = {}; TreeView.DERIVED.forEach(id => dist[id] = []);
fs.forEach(f => { const v = TreeView.computeAll(f, params); TreeView.DERIVED.forEach(id => dist[id].push(v[id])); });
const r3 = v => Math.round(v * 1000) / 1000;
const rows = TreeView.DERIVED.map(id => {
  const v = dist[id].sort((a, b) => a - b);
  return { node_id: id, segment: 'all', n: v.length,
    p10: r3(TreeView.quantile(v, .10)), p25: r3(TreeView.quantile(v, .25)), p50: r3(TreeView.quantile(v, .50)),
    p75: r3(TreeView.quantile(v, .75)), p90: r3(TreeView.quantile(v, .90)) };
});
const res = await fetch('/save?name=tree_benchmarks', { method: 'POST', body: JSON.stringify(rows, null, 1) + '\n' });
log('data/tree_benchmarks.json : ' + rows.length + ' rows → ' + res.status);
log('done');
</script>
</body>
</html>
